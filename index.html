async function encodePayload(json, plain) {
  if (!plain && canCompress()) { try { return 'v2:' + await gzipB64(json); } catch (e) { /* fall back to v1 */ } }
  return b64encode(json);
}

/* ---------- Sync code ---------- */
const SYNC_BAD = 'That code doesn’t look right — check you copied the whole thing and try again.';
const SYNC_OLD = 'This browser can’t open compressed codes. On your other device, turn on “Plain code for older browsers” and send again.';
async function buildSyncCode(opts = {}) {
  const since = opts.full ? '' : (ensureSync(S).lastSentAt || ''); // '' matches everything
  const { payload, count, at } = buildSyncPayload(since);
  if (!count) return { empty: true, at };
  const code = await encodePayload(JSON.stringify(payload), opts.plain);
  return { empty: false, code, count, at, compressed: code.startsWith('v2:') };
}
/* Everything changed (or received) after `since` — shared by sync codes and linked devices. */
function buildSyncPayload(since) {
  ensureSync(S);
  const at = stampNow();
  const recs = {};
  for (const coll of SYNC_COLLS) {
    // Untouched built-in categories (deviceId 'default') exist identically everywhere — no need to send them.
    const list = (S[coll] || []).filter(r => r && r.deviceId !== 'default' && maxTs(r.updatedAt, r._rcv) > since).map(r => { const o = { ...r }; delete o._rcv; return o; });
    if (list.length) recs[coll] = list;
  }
  const cells = {};
  for (const [k, ts] of Object.entries(S.sync.budgetCells)) {
    if (maxTs(ts, S.sync.cellRcv[k]) <= since) continue;
    const [ym, c] = splitCell(k), m = S.budgets[ym];
    cells[k] = { v: m && Object.prototype.hasOwnProperty.call(m, c) ? m[c] : null, ts };
  }
  const tombs = S.sync.tombstones.filter(t => maxTs(t.deletedAt, t.rcvAt) > since).map(t => { const o = { ...t }; delete o.rcvAt; return o; });

/* Never throws — resolves to { ok:true, payload } or { ok:false, error } */
async function parseSyncCode(code) {

/* ---------- Merge planning (shared by preview and apply) ---------- */

    const idx = new Map((S[coll] || []).map(r => [r.id, r]));
    for (const inc of list) {
      const loc = idx.get(inc.id);
      if (!loc) {
        const t = findTomb(coll, inc.id);
        if (t && t.deletedAt >= inc.updatedAt) continue; // deleted here more recently
        plan.recs.push({ coll, inc }); plan.new++; bump(coll, 'new');
      } else if (inc.updatedAt > (loc.updatedAt || '')) {
        if (sameContent(loc, inc)) { plan.silent.push({ coll, inc }); continue; }
        plan.recs.push({ coll, inc }); plan.updates++; bump(coll, 'updated');
        if (loc.deviceId === DEV && (loc.updatedAt || '') > lastSent) plan.replaced.push({ coll, id: inc.id, name: nameOf(loc) });
      } else if (inc.updatedAt < (loc.updatedAt || '') && !sameContent(loc, inc)) {

    const cur = m && Object.prototype.hasOwnProperty.call(m, cid) ? m[cid] : null;
    if (cur === c.v) plan.cellMeta.push({ k, ts: c.ts });

    if (loc && t.deletedAt > (loc.updatedAt || '')) { plan.tombs.push({ t, remove: true, merge: newerTomb }); plan.deletes++; bump(t.collection, 'removed'); }

}
async function previewSyncCode(code) {

/* Write a merge plan into S. Returns true if anything changed (then saves + re-renders). */

/* ---------- QR (progressive enhancement only) ---------- */
function qrSvg(text) {

    let qr;
    try { qr = qrcodegen.QrCode.encodeText(text, qrcodegen.QrCode.Ecc.MEDIUM); }
    catch (e) { qr = qrcodegen.QrCode.encodeText(text, qrcodegen.QrCode.Ecc.LOW); }

  if (!done) { try { ta.focus(); ta.select(); done = document.execCommand('copy'); } catch (e) { } }

  const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
  const name = `flow-sync-${devShort(DEV)}-${stamp}.txt`;
  try {

/* ---------- Repeats, fees and double charges, found in what's logged or imported ---------- */
const WINDOW_13M = () => addMonthsD(today(), -13);
/* The same payee at a steady interval and a steady price, three or more times (twice is enough for a monthly charge

function repeatCharges() {
  const from = WINDOW_13M(), groups = {};
  for (const t of S.transactions) {
    if (t.type !== 'expense' || t.date < from || t.recurringId || (t.source && t.source !== 'csv')) continue;
    const k = normDesc(t.note); if (k.length < 3) continue;

  }
  const out = [], mid = a => a[a.length >> 1];
  for (const [key, list] of Object.entries(groups)) {
    if (list.length < 2 || S.settings.radarIgnore.includes(key)) continue;
    list.sort((a, b) => a.date < b.date ? -1 : 1);
    const gap = mid(list.slice(1).map((t, i) => diffDays(list[i].date, t.date)).sort((a, b) => a - b));
    const freq = gap >= 6 && gap <= 8 ? 'weekly' : gap >= 13 && gap <= 15 ? 'biweekly' : gap >= 27 && gap <= 33 ? 'monthly' : null;
    if (!freq) continue;
    const amts = list.map(t => t.amount).sort((a, b) => a - b), amount = mid(amts), tol = freq === 'monthly' ? 0.35 : 0.15;
    if (list.length < 3 && !(freq === 'monthly' && amts[0] === amts[1])) continue;
    if (amts[amts.length - 1] > amount * (1 + tol) || amts[0] < amount * (1 - tol)) continue; // prices all over the place: ordinary shopping
    const last = list[list.length - 1];
    if (S.bills.some(b => similarDesc(b.name, last.note)) || S.recurring.some(r => r.note && similarDesc(r.note, last.note))) continue;
    out.push({ key, name: last.note, amount: last.amount, freq, perYear: last.amount * BILL_PER_YEAR[freq], count: list.length, last: last.date, category: last.category, rise: last.amount >= list[0].amount * 1.05 ? list[0].amount : 0 });
  }

}

/* The same payee and price twice within a day of each other, in the last 90 days. */
function doubleCharges() {
  const from = addDays(today(), -90), list = S.transactions.filter(t => t.type === 'expense' && t.date >= from && !t.recurringId && (!t.source || t.source === 'csv') && normDesc(t.note).length >= 3).sort((a, b) => a.date < b.date ? -1 : 1);
  const out = [], used = new Set();
  list.forEach((a, i) => {
    if (used.has(a.id)) return;
    const b = list.slice(i + 1).find(x => !used.has(x.id) && x.amount === a.amount && normDesc(x.note) === normDesc(a.note) && diffDays(a.date, x.date) <= 1);
    if (b && !S.settings.radarIgnore.includes('dbl:' + a.id)) { used.add(a.id); used.add(b.id); out.push({ a, b }); }

/* ---------- Challenges: a board of tiles, filled in any order, at your own pace ---------- */
const CH_TYPES = {
  w52: { name: '52-week climb', hint: 'One tile a week, a little more each time', tiles: base => Array.from({ length: 52 }, (_, i) => (i + 1) * base) },
  w52r: { name: '52 weeks, biggest first', hint: 'The same climb, starting at the top', tiles: base => Array.from({ length: 52 }, (_, i) => (52 - i) * base) },
  env100: { name: '100 envelopes', hint: '1 to 100, in any order you like', tiles: base => Array.from({ length: 100 }, (_, i) => (i + 1) * base) },
  penny: { name: 'A penny more each day', hint: '365 tiles, from 1¢ upward', tiles: () => Array.from({ length: 365 }, (_, i) => i + 1) },
  nospend: { name: 'No-spend days', hint: '30 days to tick, no amounts', tiles: () => Array.from({ length: 30 }, () => 0) },
  custom: { name: 'My own', hint: 'Your target, split into tiles', tiles: (base, target, count) => { const each = Math.floor(target / count); return Array.from({ length: count }, (_, i) => i === count - 1 ? target - each * (count - 1) : each); } }
};
function chProgress(c) {

}

};

const hasStone = id => S.milestones.some(m => m.id === id);

  const fresh = [];

    const repeats = S.recurring.filter(r => r.type === 'income');
    const row = x => `<div class="li exp-row">${catIcon(cat(x.kind === 'back' ? refundCat() : x.category || fallbackCat('income')))}
      <div class="grow"><div class="ellipsis" style="font-weight:600">${esc(x.name)}</div><div class="small ${x.date < today() ? 'warn' : 'muted'}">${x.date < today() ? `Was expected ${esc(fmtDay(x.date))} — has it come in?` : x.date === today() ? 'Expected today' : `Expected ${esc(fmtDay(x.date))}`}</div></div>
      <div class="num" style="font-weight:700">${money(x.amount)}</div>
      ${btn(x.kind === 'back' ? 'It came back' : 'It arrived', 'expArrived', 'secondary sm', `data-id="${x.id}"`)}${btn('✕', 'delExpected', 'ghost icon', `data-id="${x.id}" aria-label="Remove ${esc(x.name)}"`)}
    </div>`;
    return `
    <div class="grid g3 stats">
      <div class="card stat"><div class="label">Arrived this month</div><div class="value num income">${money(sum(arrived, t => t.amount))}</div></div>
      <div class="card stat"><div class="label">Still on its way</div><div class="value num" id="exp-total">${money(sum(S.expected, x => x.amount))}</div><div class="delta muted">${S.expected.length ? 'not counted until it lands' : ''}</div></div>
      <div class="card stat"><div class="label">A typical paycheck</div><div class="value num">${money(expectedPaycheck())}</div></div>
    </div>
    <section class="card" style="margin-top:16px" aria-label="Money on its way"><div class="card-h"><h3>On its way</h3></div>
      ${pay.length ? `<div class="list">${pay.map(row).join('')}</div>` : `<div class="empty-mini"><span aria-hidden="true">📬</span><div><b>Nothing expected</b><div class="small muted">Waiting on a paycheck, an invoice or a gift? Note it here. Flow only counts it once it lands.</div></div></div>`}
    </section>
    <section class="card" style="margin-top:16px" aria-label="Money owed back to you"><div class="card-h"><h3>Owed back to you</h3></div>
      ${back.length ? `<div class="list">${back.map(row).join('')}</div>` : `<div class="empty-mini"><span aria-hidden="true">↩️</span><div><b>Nothing owed back</b><div class="small muted">A return you posted, a deposit, a friend’s half of dinner — so it doesn’t slip your mind.</div></div></div>`}
    </section>
    <section class="card" style="margin-top:16px" aria-label="Arrived this month"><div class="card-h"><h3>Arrived in ${esc(monthName(ym))}</h3></div>
      ${arrived.length ? `<div class="list">${arrived.map(txnRow).join('')}</div>` : '<p class="small muted" style="margin:0">Nothing logged yet this month.</p>'}
      ${repeats.length ? `<h4 style="margin:18px 0 8px">Repeats by itself</h4><div class="list">${repeats.map(recurringRow).join('')}</div>` : ''}
    </section>`;
  }
};
const refundCat = () => (catByName('Refunds', 'income') || { id: fallbackCat('income') }).id;
ACT.logIncome = () => ACT.logExpense(null, null, { type: 'income' });
ACT.addExpected = () => openModal({
  title: 'Expecting money',
  body: `<div class="form-grid">
    <div class="full">${segHTML('kind', [['pay', 'Income on its way'], ['back', 'Owed back to me']], 'pay')}</div>
    ${field('What is it?', '<input class="input" name="name" maxlength="60" placeholder="e.g. Invoice for the logo" autofocus>', 'full')}
    ${field('Amount', moneyInput('amount', null))}
    ${field('Expected on', `<input type="date" class="input" name="date" value="${today()}">`)}
    ${field('Kind of income', selectHTML('category', catsOf('income').map(c => [c.id, c.icon + ' ' + c.name]), fallbackCat('income')), 'full')}
  </div>`,
  footer: `<button type="button" class="btn secondary" data-close-modal>Cancel</button><button type="submit" class="btn primary">Save</button>`,
  form: (m, v) => {
    const amount = toCents(v.amount);
    if (!v.name.trim()) return toast('What are you expecting?');
    if (!(amount > 0)) return toast('Please enter the amount');
    if (!isDate(v.date)) return toast('Please choose a date');
    m.close();
    commit('Noted — Flow will count it when it lands', () => S.expected.push({ id: 'ex_' + uid(), kind: v.kind === 'back' ? 'back' : 'pay', name: v.name.trim(), amount, date: v.date, category: v.category }));
  }
});
ACT.delExpected = el => commit('Removed', () => { S.expected = S.expected.filter(x => x.id !== el.dataset.id); });
ACT.expArrived = el => {
  const x = S.expected.find(e => e.id === el.dataset.id); if (!x) return;
  commit(`${money(x.amount)} logged as money in`, () => {
    S.transactions.push({ id: uid(), type: 'income', amount: x.amount, category: x.kind === 'back' ? refundCat() : x.category || fallbackCat('income'), date: today(), note: x.name, recurringId: null, loggedAt: new Date().toISOString() });
    S.expected = S.expected.filter(e => e.id !== x.id);
  });
};

VIEWS.guide = {

  sub: () => 'Every part of Flow in a sentence or two.',
  actions: () => btn('🧭 Replay the tour', 'startTour', 'secondary') + btn('🖨 Print', 'print', 'secondary'),
  render: () => `<section class="card guide" aria-label="Guide"><div class="guide-list">${GUIDE.map(([ico, name, text]) => `<div class="guide-item"><span class="stone-ico" aria-hidden="true">${ico}</span><div><b>${esc(name)}</b><p class="muted">${esc(text)}</p></div></div>`).join('')}</div>
    <div class="row no-print" style="margin-top:8px">${btn('⌨️ Keyboard shortcuts', 'shortcuts', 'secondary')}</div></section>`
};

/* ---------- Accent colors (Settings → Preferences) ---------- */
const ACCENTS = [['sage', 'Sage', '#5B8C5A'], ['lagoon', 'Lagoon', '#3E7C96'], ['plum', 'Plum', '#7A5C99'], ['clay', 'Clay', '#A8673B']];
const accentPickerHTML = () => `<div class="field"><span>Color</span><div class="swatches">${ACCENTS.map(([id, name, hex]) => `<label class="swatch" style="--sw:${hex}" title="${name}"><input type="radio" name="accent" value="${id}" data-on="setting" ${(S.settings.accent || 'sage') === id ? 'checked' : ''}><span aria-label="${name}"></span></label>`).join('')}</div></div>`;

/* =====================================================================
   DEMO BUILD ONLY — entry cap and buy button. No banner: the demo looks like the real planner.
   build.sh adds this file to site/demo/index.html and nowhere else, so
   nothing here can reach the buyer's file in dist/.

   The demo opens straight into the "Jordan" sample data. Hand-logged
   entries are counted in S.settings.demoLogged; the full planner ignores
   that key, so a backup made here opens there unchanged.
   Bills, goals, edits and Undo are never blocked: only logging new entries.
   Nothing is said about the cap until someone starts entry 21; then one
   notice offers the backup and the full planner.
   ===================================================================== */

/* The two lines worth editing. The buy button opens the listing itself. */
const DEMO_BUY_URL = 'https://www.etsy.com/listing/4586569611/flow-adhd-budget-planner-app-safe-to';
const DEMO_CAP = 20;

const demoLogged = () => { const n = +S.settings.demoLogged; return isFinite(n) && n > 0 ? Math.floor(n) : 0; };
const demoLeft = () => Math.max(0, DEMO_CAP - demoLogged());
const demoCounts = t => !t.source && !t.recurringId; // typed in by hand, not posted by a bill, goal, import or repeat

/* ---------- First open: sample data instead of the welcome screen ---------- */
const loadFull = load;
load = () => {
  const first = !readStore();
  loadFull();
  if (first) { S = demoState(); S.settings.onboarded = true; refreshStreaks(); save(); }
};

/* ---------- Counting: every change goes through commit() ---------- */
const commitFull = commit;
commit = (msg, fn, opts) => commitFull(msg, () => {
    const was = S, logged = demoLogged(), ids = new Set(S.transactions.map(t => t.id));
    const out = fn();
    if (S !== was) S.settings.demoLogged = logged; // sample data loaded or cleared: the count carries over
    else {
      const added = S.transactions.filter(t => !ids.has(t.id) && demoCounts(t)).length;
      if (added) S.settings.demoLogged = logged + added;
    }
    return out;
  }, opts);

/* ---------- The cap: the three ways a new entry starts ---------- */
const demoGate = fn => (...a) => demoLeft() > 0 ? fn(...a) : demoCapReached();
ACT.logExpense = ACT.quickAdd = demoGate(ACT.logExpense);
const txnModalFull = txnModal;
txnModal = (t, preset) => t || demoLeft() > 0 ? txnModalFull(t, preset) : demoCapReached();
ACT.csvImport = () => openModal({
  title: 'Bank import is in the full planner',
  body: '<p>The demo keeps to entries you log by hand. In the full planner you can bring in a whole bank statement (CSV) and sort it in a few taps.</p>',
  footer: '<button type="button" class="btn secondary" data-close-modal>Back to the demo</button><button type="button" class="btn primary" data-act="demoBuy">Get the full planner</button>'
});

function demoCapReached() {
  while (topModal()) topModal().close();
  openModal({
    title: `The demo holds ${DEMO_CAP} entries`,
    body: `<p><b>You’ve logged all ${DEMO_CAP}</b> — enough to feel whether Flow fits the way your brain works.</p>
      <p class="muted">Nothing you entered is lost. Download it as a file now, and the full planner opens it exactly as it is, with every entry, bill and goal in place. The full planner has no limit and no subscription.</p>`,
    footer: '<button type="button" class="btn secondary" data-act="exportJSON">Download my entries (JSON)</button><button type="button" class="btn primary" data-act="demoBuy">Get the full planner</button>'
  });
}
ACT.demoBuy = () => window.open(DEMO_BUY_URL, '_blank', 'noopener');

/* ---------- No banner at the top (sample data is cleared from Settings → Demo mode).
   One quiet way to buy at any time: under the menu on a laptop, in the "All pages" sheet on a phone. ---------- */
const DEMO_BUY_BTN = '<button type="button" class="btn primary sm block demo-buy" data-act="demoBuy">Get the full planner</button>';
const renderFull = render;
render = () => {
  renderFull();
  $('#demo-banner').innerHTML = '';
  $('#sidebar').insertAdjacentHTML('beforeend', DEMO_BUY_BTN);
};
const moreFull = ACT.more;
ACT.more = () => { const m = moreFull(); $('.modal-b', m.el).insertAdjacentHTML('beforeend', DEMO_BUY_BTN); return m; };

ACT.oneTap = demoGate(ACT.oneTap);
ACT.dupTxn = demoGate(ACT.dupTxn);
document.head.insertAdjacentHTML('beforeend', '<style>.demo-buy{margin-top:12px;flex:none}.sidebar .demo-buy{position:sticky;bottom:0;z-index:2;box-shadow:0 0 0 8px var(--side)}</style>');

/* ---------- Sync belongs to the full planner: Settings shows a note instead of the sync card ---------- */
syncCardHTML = () => `<section class="card" style="margin-top:16px" data-tour="sync" id="demo-sync">
  <div class="card-h"><h3>🔗 Sync devices</h3><span class="badge">Full planner</span></div>
  <p class="small muted">Carrying your entries between your phone and laptop is part of the full planner. The demo keeps everything on this one device.</p>
  <div class="row">${btn('Get the full planner', 'demoBuy', 'primary')}</div>
</section>`;

</script>
