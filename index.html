<!doctype html>
<html lang="en" data-theme="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow — ADHD Budget Planner</title>
<meta name="description" content="A calm, offline budget planner designed for ADHD brains: Safe to Spend always in view, 3-tap logging, focus mode, gentle streaks and weekly money dates.">
<meta name="theme-color" content="#5B8C5A">
<!-- Flow's mark as the tab icon: drawn inline, so there is no image file to load. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 2c17 0 30 13 30 31S49 62 32 62 2 51 2 33 15 2 32 2z' fill='%235B8C5A'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round'%3E%3Cpath d='M11 40c7 0 7-10 14-10s7 10 14 10 7-10 14-10'/%3E%3Cpath d='M11 26c7 0 7-8 14-8s7 8 14 8 7-8 14-8' opacity='.55'/%3E%3C/g%3E%3C/svg%3E">
<script>
/* Apply the saved theme before first paint so there is no unstyled flash. */
(function(){try{var o=JSON.parse(localStorage.getItem('flow_adhd_budget_demo'));var s=o&&(o.state||o);var t=s&&s.settings&&s.settings.theme;if(t==='auto')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'calm';if(t==='light'||t==='dark'||t==='calm')document.documentElement.setAttribute('data-theme',t);if(s&&s.settings&&s.settings.bigText)document.documentElement.classList.add('big-text');if(s&&s.settings&&s.settings.accent&&s.settings.accent!=='sage')document.documentElement.setAttribute('data-accent',s.settings.accent);}catch(e){}})();
</script>
<style>
/* =====================================================================
   FLOW DESIGN SYSTEM — "go with the flow"
   Stepping-stone sidebar · one calm column · sticky pond (Safe to Spend)
   Borderless tinted surfaces · pill buttons · water that fills and drains
   No reds in any theme.
   ===================================================================== */
:root, [data-theme="calm"]{
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F2ECE2; --line:#E6DDCF;
  --text:#34302B; --muted:#756C61; --primary:#5B8C5A; --primary-strong:#476F46; --primary-contrast:#FFFFFF; --primary-soft:#E5EEDF;
  --water:#4E9A96; --water-2:#7DB9B2; --mist:#DCEBE7; --sand:#EDE3D2;
  --good:#4B844A; --good-soft:#E5EEDF; --warn:#946420; --warn-bar:#D8A24C; --warn-soft:#F8ECD8;
  --income:#5B8C5A; --expense:#C9B89F; --grid:#EAE2D6; --overlay:rgba(52,48,43,.36);
  --lift:0 1px 2px rgba(52,48,43,.04),0 14px 36px rgba(52,48,43,.06);
  --side:#F2ECE1; --side-shade:6px 0 28px rgba(52,48,43,.07);
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
}
[data-theme="light"]{
  --bg:#F5F7F4; --surface:#FFFFFF; --surface-2:#ECF0EA; --line:#DFE5DC;
  --text:#1E2A22; --muted:#5D685E; --primary:#4F7F4E; --primary-strong:#3F6A3E; --primary-contrast:#FFFFFF; --primary-soft:#E2EEE0;
  --water:#3E8C88; --water-2:#79B6AF; --mist:#DDEDEA; --sand:#EEE8DC;
  --good:#3F7A3E; --good-soft:#E2EEE0; --warn:#8A5B14; --warn-bar:#D39A3F; --warn-soft:#FAEFDC;
  --income:#4F7F4E; --expense:#B9C4BA; --grid:#E4E9E1; --overlay:rgba(30,42,34,.36);
  --lift:0 1px 2px rgba(30,42,34,.05),0 14px 36px rgba(30,42,34,.07);
  --side:#E9EFE6; --side-shade:6px 0 28px rgba(30,42,34,.08);
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
}
[data-theme="dark"]{
  --bg:#141814; --surface:#1D221D; --surface-2:#262C26; --line:#323931;
  --text:#E8EBE4; --muted:#A2AA9F; --primary:#8FC08C; --primary-strong:#A6CFA3; --primary-contrast:#132012; --primary-soft:rgba(143,192,140,.14);
  --water:#5FAEA8; --water-2:#3D7F7A; --mist:rgba(95,174,168,.16); --sand:rgba(230,210,170,.10);
  --good:#8FC08C; --good-soft:rgba(143,192,140,.14); --warn:#E6B46B; --warn-bar:#C9954B; --warn-soft:rgba(230,180,107,.14);
  --income:#8FC08C; --expense:#7E776C; --grid:#2E352D; --overlay:rgba(6,9,6,.66);
  --lift:0 1px 2px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.28);
  --side:#1A1F1A; --side-shade:6px 0 28px rgba(0,0,0,.35);
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
}

/* ============ BASE (type scale 12 / 14 / 16 / 20 / 24 / 32) ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:650;letter-spacing:-.005em}
h1{font-size:32px} h2{font-size:24px} h3{font-size:20px} h4{font-size:16px}
p{margin:0 0 8px}
a{color:var(--primary)}
.num,td.num,.value{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px} .xs{font-size:12px}
.good{color:var(--good)} .warn{color:var(--warn)} .income{color:var(--income)}
.center{text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1 1 auto;min-width:0}
.right{text-align:right}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============ LAYOUT: stones · column · pond ============ */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;z-index:5;height:100vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;padding:26px 18px 20px 22px;display:flex;flex-direction:column;gap:6px;background:var(--side);border-right:1px solid var(--line);border-radius:0 28px 28px 0;box-shadow:var(--side-shade)}
.sidebar::-webkit-scrollbar{display:none;width:0;height:0}
@media screen and (max-height:900px){.sidebar{padding-top:20px;padding-bottom:14px}.brand{padding-bottom:14px}.sidebar .btn.log{margin-bottom:12px}.stone{min-height:44px}.stone .dot-stone{width:40px;height:40px;font-size:16px}.stone-list::before{left:19px}}
/* Short laptop screens (e.g. 1080p at 125% scaling ≈ 730px tall): everything still fits, nothing is cut off */
@media screen and (max-height:800px){.sidebar{padding-top:16px;padding-bottom:12px;gap:4px}.brand{padding-bottom:10px}.brand .drop-mark{width:36px;height:36px}.sidebar .btn.log{margin-bottom:8px;min-height:42px}.stone{min-height:38px;padding-top:2px;padding-bottom:2px;font-size:15px}.stone .dot-stone{width:34px;height:34px;font-size:15px}.stone-list::before{left:16px;top:18px;bottom:18px}.stone[aria-current="page"] .dot-stone{box-shadow:0 0 0 4px var(--primary-soft)}.sidebar-foot{padding-top:10px;line-height:1.45}}
.brand{display:flex;align-items:center;gap:12px;padding:0 0 22px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.drop-mark{width:40px;height:40px;flex:none;display:grid;place-items:center;color:var(--primary-contrast);background:var(--primary);border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;box-shadow:inset 0 -6px 12px rgba(0,0,0,.08)}
.drop-mark.big{width:78px;height:78px;margin:0 auto 20px}
.sidebar .btn.log{margin:0 0 18px}
.stone-list{position:relative;display:flex;flex-direction:column;gap:2px}
.stone-list::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 12px);border-radius:2px}
.stone{position:relative;display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;color:var(--text);padding:5px 8px 5px 0;border-radius:999px;font:inherit;font-size:16px;cursor:pointer;text-align:left;min-height:48px}
.stone .dot-stone{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none;box-shadow:var(--lift);transition:transform .2s,background .2s;z-index:1}
.stone:hover .dot-stone{transform:scale(1.06)}
.stone[aria-current="page"]{font-weight:700;color:var(--primary-strong)}
.stone[aria-current="page"] .dot-stone{background:var(--primary);box-shadow:0 0 0 6px var(--primary-soft)}
.stone kbd{margin-left:auto;font-size:12px;color:var(--muted);font-family:inherit;opacity:0;transition:opacity .2s}
.sidebar:hover .stone kbd{opacity:.7}
.sidebar-foot{margin-top:auto;padding:16px 4px 0;font-size:12px;color:var(--muted);line-height:1.6}
.main{min-width:0;display:flex;flex-direction:column;--page:1400px;--gutter:32px}
/* One centred page frame: banner, header, stage and footer share the same edges at every width */
.topbar,.stage,.footer{width:100%;max-width:var(--page);margin-inline:auto;padding-inline:var(--gutter)}
.demo-banner{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px;padding:10px 16px;margin:14px auto 0;width:calc(100% - 2 * var(--gutter));max-width:calc(var(--page) - 2 * var(--gutter));background:var(--sand);border-radius:999px}
.demo-pill{background:var(--warn-bar);color:#2B2112;font-weight:700;font-size:12px;letter-spacing:.08em;padding:2px 10px;border-radius:999px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:30px;padding-bottom:20px;flex-wrap:wrap}
.topbar .sub{color:var(--muted);font-size:16px;margin-top:4px}
.topbar .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stage{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,24vw,372px);gap:28px;padding-bottom:32px;align-items:start}
.stage:has(> .aside:empty){grid-template-columns:minmax(0,1fr)}
.content{min-width:0}
.aside{position:sticky;top:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.aside:empty{display:none}
.footer{padding-top:18px;padding-bottom:28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.privacy-badge{display:inline-flex;align-items:center;gap:6px;background:var(--mist);color:var(--water);border-radius:999px;padding:6px 16px;font-weight:600;font-size:14px}
[data-theme="calm"] .privacy-badge,[data-theme="light"] .privacy-badge{color:#2F6F6B}
.bottombar,.m-header,.print-head{display:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ============ SURFACES ============ */
.card{background:var(--surface);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--lift);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:16px;font-weight:700}
.section-h{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 4px 10px}
.stat{background:var(--surface-2);box-shadow:none}
.stat .label{color:var(--muted);font-size:14px}
.stat .value{font-size:24px;font-weight:700;margin-top:4px}
.stat .delta{font-size:12px;margin-top:4px}
.callout{border-radius:var(--r-md);padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-size:14px}
.callout.good{background:var(--good-soft)} .callout.warn{background:var(--warn-soft)} .callout.primary{background:var(--mist)}
.callout ul.opts{margin:0;padding-left:18px}
.list{display:flex;flex-direction:column;gap:4px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);min-width:0;background:var(--bg)}
.li-tap{border:0;background:transparent;padding:0;cursor:pointer;border-radius:12px;min-width:44px;min-height:44px;display:grid;place-items:center}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .e-ico{font-size:40px;margin-bottom:10px}
.empty h3{color:var(--text);margin-bottom:6px}
.empty p{max-width:420px;margin:0 auto 16px}
.empty-mini{display:flex;gap:14px;align-items:center;padding:8px 4px}
.empty-mini > span{font-size:26px}
.soft-danger{background:var(--sand);box-shadow:none}

/* ============ CONTROLS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-size:14px;font-weight:650;cursor:pointer;min-height:42px;background:var(--surface-2);color:var(--text);white-space:nowrap;transition:background .2s,transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--primary);color:var(--primary-contrast);box-shadow:0 8px 20px -8px var(--primary)}
.btn.primary:hover{background:var(--primary-strong)}
.btn.secondary{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.secondary:hover{box-shadow:inset 0 0 0 1.5px var(--primary)}
.btn.ghost{background:transparent;color:var(--primary-strong)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.log{background:var(--primary-soft);color:var(--primary-strong);font-size:16px;min-height:48px}
.btn.log:hover{background:var(--primary);color:var(--primary-contrast)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.lg{font-size:16px;min-height:54px;padding:12px 24px}
.btn.sm{padding:6px 14px;min-height:36px;font-size:14px}
.btn.icon{padding:0;width:40px;min-height:40px;font-size:16px}
.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);min-width:0}
.field > span{font-weight:650}
.field > .seg{align-self:flex-start}
.input,select.input,textarea.input{width:100%;border:0;background:var(--surface-2);color:var(--text);border-radius:var(--r-sm);padding:10px 14px;font:inherit;font-size:16px;min-height:46px;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--water)}
textarea.input{min-height:80px;resize:vertical}
.input.huge{font-size:32px;font-weight:700;text-align:center;padding:12px;min-height:66px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button,.seg label{border:0;background:transparent;color:var(--muted);padding:6px 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:650;cursor:pointer;min-height:36px;display:inline-flex;align-items:center}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg button[aria-pressed="true"],.seg label:has(input:checked){background:var(--surface);color:var(--text);box-shadow:var(--lift)}
.toggle{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;min-height:42px}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .track{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.toggle .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked + .track{background:var(--primary)}
.toggle input:checked + .track::after{transform:translateX(18px)}
.toggle input:focus-visible + .track{outline:3px solid var(--water);outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;vertical-align:middle}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.soft{background:rgba(255,255,255,.55);color:var(--primary-strong)}
[data-theme="dark"] .badge.soft{background:rgba(0,0,0,.25)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.cat-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;background:color-mix(in srgb,var(--cc,#8C8579) 18%,var(--surface))}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:12px;font-weight:500;padding:6px 10px;border-radius:10px;white-space:nowrap;z-index:50;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip > span{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 15px;cursor:pointer;font-size:14px;background:var(--surface-2);min-height:42px;color:var(--text);transition:background .15s}
.chip input:checked + span{background:var(--primary);color:var(--primary-contrast);font-weight:700}
.chip input:focus-visible + span{outline:3px solid var(--water);outline-offset:2px}
.chip-btn{border:0;background:var(--surface-2);color:var(--text);border-radius:999px;padding:8px 15px;font:inherit;font-size:14px;cursor:pointer;min-height:42px}
.chip-btn:hover{background:var(--mist)}
.progress{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress > i{display:block;height:100%;border-radius:999px;background:var(--water);transition:width .5s ease}
.progress.good > i{background:var(--primary)}
.progress.soft-warn > i{background:var(--warn-bar)}
details.fold > summary{cursor:pointer;font-weight:650;list-style:none;display:flex;align-items:center;gap:8px;min-height:40px;color:var(--text)}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;margin:0 4px}
details.fold[open] > summary::before{transform:rotate(45deg)}
@keyframes ease-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.content > *{animation:ease-in .35s ease-out both}

/* Focus toggle — prominent pill in the header */
.focus-toggle{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--surface);color:var(--text);border-radius:999px;padding:6px 16px 6px 7px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;box-shadow:var(--lift)}
.focus-toggle .ft-track{width:38px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.focus-toggle .ft-track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.focus-toggle[aria-pressed="true"]{background:var(--primary);color:var(--primary-contrast)}
.focus-toggle[aria-pressed="true"] .ft-track{background:rgba(255,255,255,.35)}
.focus-toggle[aria-pressed="true"] .ft-track::after{transform:translateX(14px)}

/* ============ SIGNATURE: THE POND (Safe to Spend) ============ */
.pond{position:relative;overflow:hidden;border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--lift);isolation:isolate}
.pond-water{position:absolute;left:0;right:0;bottom:0;height:var(--level,55%);background:linear-gradient(180deg,var(--mist),color-mix(in srgb,var(--water-2) 45%,var(--mist)));z-index:-1;transition:height 1.2s ease}
.pond-water svg{position:absolute;left:0;top:-15px;width:200%;height:16px;animation:drift 9s linear infinite}
.pond-water svg path{fill:var(--mist)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.hero{padding:30px 30px 26px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hero-label{font-size:16px;font-weight:700;color:var(--primary-strong)}
.hero-num{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:14px 0 2px;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .hero-num{margin:18px 0 10px;font-size:clamp(32px,2.2vw + 14px,48px)}
.hero-sub{color:var(--muted);font-size:16px;margin:6px 0 22px;max-width:30em}
.hero-actions{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;max-width:640px}
.hero-move{margin-top:12px;background:rgba(255,255,255,.5)}
[data-theme="dark"] .hero-move{background:rgba(0,0,0,.2)}
.hero-math{margin-top:14px}
.math{display:flex;flex-direction:column;gap:4px;margin-top:4px;background:rgba(255,255,255,.6);border-radius:var(--r-md);padding:12px 14px}
[data-theme="dark"] .math{background:rgba(0,0,0,.25)}
.math > div{display:flex;justify-content:space-between;gap:12px}
.math .tot{border-top:1px dashed var(--line);padding-top:6px;margin-top:2px;font-weight:700}
.pond-mini{padding:22px 22px 18px}
.pond-mini .pin-label{font-size:14px;font-weight:700;color:var(--primary-strong)}
.pond-mini .pin-num{display:block;font-size:32px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.pond-mini .pin-sub{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
.pond-mini .btn{background:rgba(255,255,255,.65)}
[data-theme="dark"] .pond-mini .btn{background:rgba(0,0,0,.25)}

/* Streak droplets */
.streak-card{display:flex;flex-direction:column;gap:10px}
.drops,.drop-days{justify-content:space-between;max-width:320px}
.drops{display:flex;gap:8px}
.drop{width:22px;height:28px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:var(--surface-2);position:relative}
.drop.on{background:linear-gradient(180deg,var(--water-2),var(--water))}
.drop.today{box-shadow:0 0 0 3px var(--mist)}
.drop-days{display:flex;gap:8px;font-size:12px;color:var(--muted)}
.drop-days span{width:22px;text-align:center}

/* Home */
.home-main,.focus-home{display:flex;flex-direction:column;gap:22px;min-width:0}
.focus-home{max-width:620px;margin:0 auto}
.today{padding:22px 16px 14px}
.today .card-h{padding:0 8px}
.mini-txn{display:flex;align-items:center;gap:4px;border-radius:var(--r-md)}
.mini-txn:hover{background:var(--bg)}
.mini-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;text-align:left;padding:10px 8px;cursor:pointer;border-radius:var(--r-md)}
.mini-main .grow{display:flex;flex-direction:column}
.t-title{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@keyframes ripple{from{box-shadow:0 0 0 0 var(--mist);background:var(--mist)}to{box-shadow:0 0 0 18px transparent;background:transparent}}
.just-added{animation:ripple 1.4s ease-out}
.md-nudge{display:flex;gap:14px;align-items:center;background:var(--mist);box-shadow:none}
.md-mini{display:flex;gap:14px;align-items:center;background:var(--surface-2);box-shadow:none}
.md-ico{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:22px;flex:none}
.md-mini > span{font-size:22px}

/* The pond column is narrow: rows stack their button underneath */
.aside .bill-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.aside .bill-row > .btn{grid-column:2 / -1;justify-self:start}
.aside .md-nudge{flex-wrap:wrap}
.aside .md-nudge .grow{flex-basis:calc(100% - 64px)}
.aside .md-nudge > .btn{margin-left:60px}

/* Log sheet */
.log-sheet{display:flex;flex-direction:column;gap:16px}
.amt-wrap{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:10px 0 2px;background:var(--mist);border-radius:var(--r-lg)}
.amt-cur{font-size:24px;font-weight:700;color:var(--water)}
.amt-input{border:0;background:transparent;color:var(--text);font:inherit;font-size:32px;font-weight:800;width:6em;text-align:center;padding:6px 4px 12px;font-variant-numeric:tabular-nums}
.amt-input:focus{outline:none}
.quick-amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{border:0;background:var(--surface-2);color:var(--text);border-radius:999px;font:inherit;font-size:16px;font-weight:700;min-height:46px;cursor:pointer;font-variant-numeric:tabular-nums;transition:background .15s}
.qa:hover{background:var(--mist)}
.qa.on{background:var(--water);color:#fff}
.pad{display:none;grid-template-columns:repeat(3,1fr);gap:8px}
.pad-k{border:0;background:var(--surface-2);color:var(--text);border-radius:50%;aspect-ratio:1.6;font:inherit;font-size:20px;font-weight:650;min-height:48px;cursor:pointer}
.pad-k:active{background:var(--mist)}

/* Budget — pools */
.month-nav{margin-bottom:14px}
.month-title{min-width:170px;text-align:center;font-size:20px}
.zb{background:var(--sand);box-shadow:none}
.zb-eq{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.zb-eq > div{display:flex;flex-direction:column}
.zb-eq b{font-size:20px}
.zb-eq .op{font-size:20px;color:var(--muted);padding-bottom:2px}
.zb-left b{font-size:24px;color:var(--primary-strong)}
.env-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.env-card{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:6px;text-align:left;border:0;background:var(--surface);color:var(--text);border-radius:var(--r-lg);padding:16px 18px;font:inherit;cursor:pointer;box-shadow:var(--lift);transition:transform .15s}
.env-card:hover{transform:translateY(-2px)}
.pool-water{position:absolute;left:0;right:0;bottom:0;height:var(--fill,50%);background:linear-gradient(180deg,var(--mist),color-mix(in srgb,var(--water-2) 35%,var(--mist)));z-index:-1;transition:height .8s ease}
.env-card.is-over{background:var(--warn-soft)}
.env-card.is-over .pool-water{height:100%;background:linear-gradient(180deg,transparent 55%,color-mix(in srgb,var(--warn-bar) 30%,transparent))}
.env-top{display:flex;align-items:center;gap:10px}
.env-name{font-weight:700;flex:1}
.env-left{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.env-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.env-stats > div{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px}
.env-stats b{display:block;font-size:20px}
.donors{display:flex;flex-direction:column;gap:8px}
.donor{display:flex;align-items:center;gap:12px;border:0;background:var(--surface-2);color:var(--text);border-radius:var(--r-md);padding:10px 14px;font:inherit;cursor:pointer;text-align:left;min-height:58px}
.donor:hover{background:var(--mist)}
.donor .grow{display:flex;flex-direction:column}

/* Activity */
.txn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 10px;cursor:pointer;border-radius:var(--r-md)}
.txn:hover{background:var(--bg)}
.txn .t-main{min-width:0}
.txn .t-amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.day-h{font-size:12px;font-weight:700;color:var(--muted);padding:16px 10px 4px;text-transform:uppercase;letter-spacing:.08em}
.filters{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.filters-card{padding:12px;background:var(--surface-2);box-shadow:none}
.filters-card .input{background:var(--surface)}

/* Bills — stream timeline */
.timeline{margin:6px 0 4px}
.tl-bar{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,var(--mist),var(--primary-soft));margin:22px 12px 10px}
.tl-dot{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--water);border:3px solid var(--surface)}
.tl-dot.pre{background:var(--warn-bar)}
.tl-pay{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:22px}
.tl-labels{position:relative;height:18px;font-size:12px;color:var(--muted);margin:0 12px}
.tl-labels span{position:absolute;white-space:nowrap;transform:translateX(-50%)}
.tl-labels span:first-child{left:0;transform:none}
.tl-labels span.end{right:0;left:auto;transform:none}
.bill-row .btn{flex:none}

/* Debt */
.order{list-style:none;margin:6px 0 12px;padding:0;display:flex;flex-direction:column;gap:8px}
.order li{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:999px;padding:8px 18px 8px 8px}
.rank{width:34px;height:34px;border-radius:50%;background:var(--primary);color:var(--primary-contrast);display:grid;place-items:center;font-weight:800;flex:none}
.nudge{display:flex;gap:14px;align-items:center;background:var(--sand);box-shadow:none}
.nudge-ico{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:20px;flex:none}

/* Goals */
.goal-card{display:flex;flex-direction:column}
.goal-plan{margin:14px 0 12px;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch input{position:absolute;opacity:0}
.swatch span{display:block;width:34px;height:34px;border-radius:50%;background:var(--sw);cursor:pointer;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch input:checked + span{box-shadow:0 0 0 3px var(--text)}

/* Money dates — stepping stones */
.md-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.md-steps > div{display:flex;flex-direction:column;gap:2px;background:var(--mist);border-radius:var(--r-lg);padding:16px}
.step-n{width:30px;height:30px;border-radius:50%;background:var(--water);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;margin-bottom:6px}
.md-timeline{list-style:none;margin:0;padding:0 0 0 8px;position:relative}
.md-timeline::before{content:"";position:absolute;left:14px;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(to bottom,var(--mist) 0 6px,transparent 6px 12px)}
.md-timeline li{position:relative;padding:0 0 18px 34px}
.md-timeline li:last-child{padding-bottom:0}
.md-dot{position:absolute;left:0;top:2px;width:14px;height:14px;margin-left:1px;border-radius:50%;background:var(--water);box-shadow:0 0 0 5px var(--mist)}
.md-progress{display:flex;gap:6px;margin-bottom:6px}
.md-progress i{flex:1;height:6px;border-radius:6px;background:var(--surface-2)}
.md-progress i.on{background:var(--water)}
.md-h{font-size:20px;margin:6px 0 12px}
.md-glance{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:var(--r-lg);padding:20px}
.md-glance::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:var(--mist);z-index:-1}
.md-glance b{font-size:32px;font-weight:800;letter-spacing:-.02em}

/* Charts + lists */
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:650;padding:8px;white-space:nowrap}
.tbl td{padding:8px;border-top:1px solid var(--grid);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:12px;font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hbar{display:grid;grid-template-columns:minmax(100px,160px) 1fr auto;gap:12px;align-items:center;padding:7px 0;font-size:14px}
.hbar .bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.hbar .bar i{display:block;height:100%;border-radius:999px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}

/* Modal + bottom sheet */
.modal-overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:fade .2s;backdrop-filter:blur(2px)}
.modal{background:var(--surface);color:var(--text);border-radius:var(--r-xl);width:100%;max-width:540px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.22);animation:pop .25s ease-out}
.modal.sheet{max-width:500px}
.modal.lg{max-width:880px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 8px;gap:12px}
.modal-h h3{font-size:20px}
.modal-b{padding:12px 22px 18px;overflow:auto}
.modal-f{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}

/* Toasts */
.toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--text);color:var(--bg);border-radius:999px;padding:10px 12px 10px 20px;display:flex;gap:14px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.2);animation:pop .25s;font-weight:500;font-size:14px}
.toast button{background:rgba(255,255,255,.14);border:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:4px 14px;border-radius:999px;min-height:36px}

/* Welcome + tour */
.welcome{position:fixed;inset:0;background:var(--bg);z-index:150;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px}
.welcome::before{content:"";position:fixed;left:0;right:0;bottom:0;height:34vh;background:linear-gradient(180deg,transparent,var(--mist));z-index:-1}
.welcome-card{max-width:600px;width:100%;text-align:center}
.welcome-card h1{margin-bottom:8px}
.w-lead{font-size:16px;max-width:480px;margin:0 auto}
.welcome-feats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:24px 0}
.welcome-feats div{background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;box-shadow:var(--lift)}
.welcome .form-grid{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--lift)}
.tour-hl{position:relative;z-index:120!important;box-shadow:0 0 0 5px var(--water),0 0 0 9999px var(--overlay)!important}
.tour-card{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:130;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 24px 60px rgba(0,0,0,.28);padding:20px 22px;width:min(460px,calc(100vw - 32px))}
.tour-steps{display:flex;gap:6px;margin-bottom:10px}
.tour-steps i{width:10px;height:10px;border-radius:50%;background:var(--surface-2)}
.tour-steps i.on{background:var(--water)}
.kbd-list{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center;font-size:14px}
kbd.k{display:inline-block;min-width:30px;text-align:center;border-radius:8px;padding:2px 8px;font-family:inherit;font-weight:700;background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--line)}
.sheet-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet-nav button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border:0;background:var(--surface-2);border-radius:var(--r-lg);font:inherit;font-size:14px;color:var(--text);cursor:pointer;min-height:84px}
.sheet-nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary-strong);font-weight:700}
.sheet-nav .ico{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:20px}
.dropzone{border:2px dashed var(--line);border-radius:var(--r-lg);padding:32px 16px;text-align:center;cursor:pointer;transition:background .15s}
.dropzone.over{background:var(--mist);border-color:var(--water)}
tr.dup td{color:var(--muted);background:var(--surface-2)}
.print-only{display:none}

/* ============ CHECK MY MONEY · ONE-TAP · SMALL THINGS ============ */
.view-seg{margin-bottom:16px}
.card-h .view-seg{margin-bottom:0}
.hero-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero-links .hero-move{margin-top:0}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;max-width:640px}
.tile{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-width:0;border:0;border-radius:999px;padding:8px 16px 8px 12px;min-height:44px;font:inherit;font-size:14px;cursor:pointer;color:var(--text);background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .12s,box-shadow .2s}
.tile:hover{box-shadow:inset 0 0 0 1.5px var(--water)}
.tile:active{transform:scale(.97)}
[data-theme="dark"] .tile{background:rgba(0,0,0,.25)}
.away{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--mist);box-shadow:none}
.away .grow{flex-basis:260px}
.things{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.thing{display:flex;align-items:center;gap:12px;min-height:46px}
.thing .grow{display:flex;flex-direction:column;line-height:1.3}
.thing-dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--primary-contrast);box-shadow:inset 0 0 0 2px var(--line)}
.thing.done .thing-dot{background:var(--primary);box-shadow:none}
.thing.done b{font-weight:600;color:var(--muted)}
html.big-text body{zoom:1.12}

/* ============ BILLS: CALENDAR · SUBSCRIPTIONS ============ */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-head{margin:10px 0 6px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.cal-day{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-height:76px;min-width:0;padding:9px 10px;border:0;border-radius:var(--r-md);background:var(--surface-2);color:var(--text);font:inherit;cursor:pointer;text-align:left}
.cal-day:hover{background:var(--mist)}
.cal-day.today{background:var(--mist);box-shadow:inset 0 0 0 2px var(--water)}
.cal-day.past .cal-n{color:var(--muted)}
.cal-n{font-weight:700;font-size:14px;line-height:1}
.cal-dots{display:flex;gap:3px;min-height:8px}
.cal-dots i{width:8px;height:8px;border-radius:50%}
.cal-dots .due{background:var(--warn-bar)}
.cal-dots .paid{background:var(--primary)}
.cal-dots .inc{background:var(--water)}
.cal-amt{margin-top:auto;font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;white-space:nowrap}
.sub-row.found{flex-wrap:wrap}
.sub-acts{flex-basis:100%;padding-left:52px}

/* ============ DEBT: STRATEGIES SIDE BY SIDE ============ */
.range{width:100%;height:44px;margin:0;accent-color:var(--primary);cursor:pointer}
.plan-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.plan-col{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:var(--r-md);padding:14px 16px;min-width:0}
.plan-col b{font-size:20px}
.plan-col.on{background:var(--mist)}

/* ============ PLAN: STEPS · BRAIN DUMP · PAUSED BUYS ============ */
.plan-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.task-add{margin-top:14px}
.task-add .input,.note-add .input{flex:1;min-width:0}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:var(--r-md);padding:4px 8px 4px 4px;min-width:0;min-height:52px}
.task > .grow{overflow-wrap:break-word;min-width:0;padding-left:8px}
.task-tick + .grow{padding-left:0}
.task.done > .grow{color:var(--muted);text-decoration:line-through}
.task-tick{width:44px;height:44px;flex:none;border:0;border-radius:50%;cursor:pointer;font:inherit;font-size:14px;font-weight:800;color:var(--primary-contrast);background:radial-gradient(circle,transparent 0 10px,var(--line) 10.5px 12.5px,transparent 13px)}
.task.done .task-tick{background:radial-gradient(circle,var(--primary) 0 12.5px,transparent 13px)}
.wish{background:var(--bg);border-radius:var(--r-lg);padding:14px 16px}
.wish.ready{background:var(--good-soft)}

/* ============ GOALS: CHALLENGE TILES · STEPPING STONES ============ */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.ch-grid.dense{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
.ch-tile{min-height:44px;min-width:0;border:0;border-radius:var(--r-sm);background:var(--surface-2);color:var(--text);font:inherit;font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;cursor:pointer;padding:0 2px;transition:background .2s,transform .12s}
.ch-tile:hover{background:var(--mist)}
.ch-tile:active{transform:scale(.94)}
.ch-tile.on{background:linear-gradient(180deg,var(--water-2),var(--water));color:#fff}
.ch-tile.hint{box-shadow:0 0 0 3px var(--warn-bar)}
.stones{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px;margin-top:6px}
.stone-m{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-lg);background:var(--bg);min-width:0}

<script>
'use strict';
/* =====================================================================
   Flow — ADHD Budget Planner
   Offline, single-file. Everything lives in localStorage under ONE key.
   All money is stored as integer cents.
   Engine forked from Vault — Ultimate Personal Finance Dashboard.
   ===================================================================== */

const KEY = 'flow_adhd_budget_demo';
const APP_VERSION = '1.1.0';

/* ---------- DOM + string helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sum = (arr, f = x => x) => arr.reduce((s, x) => s + (f(x) || 0), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- Dates (local time, 'YYYY-MM-DD' strings) ---------- */
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const today = () => dstr(new Date());
const curYM = () => today().slice(0, 7);
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const daysInMonth = (y, m) => new Date(y, m, 0).getDate(); // m is 1-12
const addMonthsYM = (ym, n) => {
  let [y, m] = ym.split('-').map(Number);
  const t = y * 12 + (m - 1) + n;
  return `${Math.floor(t / 12)}-${pad((t % 12) + 1)}`;
};
/* Add months to a date, keeping the original day of month where possible (Jan 31 → Feb 28 → Mar 31). */
const addMonthsD = (s, n, anchorDay) => {
  const ym = addMonthsYM(s.slice(0, 7), n);
  const [y, m] = ym.split('-').map(Number);
  const day = Math.min(anchorDay || +s.slice(8, 10), daysInMonth(y, m));
  return `${ym}-${pad(day)}`;
};
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5); // b − a
const ymDays = ym => { const [y, m] = ym.split('-').map(Number); return daysInMonth(y, m); };
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const monthName = (ym, short) => { const [y, m] = ym.split('-').map(Number); const n = MONTHS[m - 1]; return short ? n.slice(0, 3) : `${n} ${y}`; };
const fmtDate = (s, opts) => { try { return parseD(s).toLocaleDateString(undefined, opts || { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return s; } };
const fmtDay = s => fmtDate(s, { weekday: 'short', month: 'short', day: 'numeric' });
const weekStart = s => { const d = parseD(s); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return dstr(d); }; // Monday
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseD(s));
const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
const localDateOf = iso => { try { const d = new Date(iso); return isNaN(d) ? '' : dstr(d); } catch (e) { return ''; } };
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;

/* ---------- Money ---------- */
/* Parse user / bank text into integer cents. Handles "$1,234.56", "1.234,56", "(45.00)", "45.00-", "-12". */
function toCents(v) {
  if (typeof v === 'number') return isFinite(v) ? Math.round(v * 100) : NaN;
  let s = String(v == null ? '' : v).trim();
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/-\s*$/.test(s)) { neg = true; s = s.replace(/-\s*$/, ''); }
  if (/\b(dr|debit)\b/i.test(s)) neg = true;
  s = s.replace(/[^\d.,-]/g, '');
  if (s.startsWith('-')) { neg = !neg; }
  s = s.replace(/-/g, '');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > ld && s.length - lc - 1 <= 2) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(/,/g, '');
  if (!/^\d*\.?\d*$/.test(s) || s === '' || s === '.') return NaN;

  const cents = (parseInt(ip || '0', 10) * 100) + parseInt((fp + '00').slice(0, 2), 10) + (fp.length > 2 && +fp[2] >= 5 ? 1 : 0);
  return neg ? -cents : cents;
}
const CURRENCIES = [
  ['USD', 'US Dollar'], ['EUR', 'Euro'], ['GBP', 'British Pound'], ['CAD', 'Canadian Dollar'], ['AUD', 'Australian Dollar'],
  ['NZD', 'New Zealand Dollar'], ['INR', 'Indian Rupee'], ['PKR', 'Pakistani Rupee'], ['AED', 'UAE Dirham'], ['SAR', 'Saudi Riyal'],

  if (undoFn) {

/* ---------- Recurring engine (from Vault) ---------- */
function advanceByFreq(date, freq, anchor) {

/* Post every recurring item whose nextDate <= today, advancing nextDate. Returns count posted. */

    let guard = 0, moved = false;
    while (r.nextDate <= now && guard++ < 1000) {
      // Deterministic id: two synced devices posting the same occurrence produce ONE record, not a duplicate.
      const id = 'rc_' + r.id + '_' + r.nextDate;
      if (!S.transactions.some(t => t.id === id)) {
        S.transactions.push({ id, type: r.type, amount: r.amount, category: r.category, date: r.nextDate, note: r.note || '', recurringId: r.id, loggedAt: new Date().toISOString(), updatedAt: stampNow(), deviceId: DEV });

/* ---------- Paydays ---------- */

/* The last day anything happened by hand — used to welcome you back after a quiet stretch. */

const BILL_FREQ = [['monthly', 'Every month'], ['weekly', 'Every week'], ['biweekly', 'Every 2 weeks'], ['twice-monthly', 'Twice a month'], ['every-n', 'Every few months'], ['yearly', 'Once a year'], ['once', 'Just once']];
const billFreq = b => b.freq || 'monthly';
const billDueDate = (b, key) => key.length === 7 ? `${key}-${pad(Math.min(b.dueDay, ymDays(key)))}` : key;
const billKey = (b, date) => billFreq(b) === 'monthly' ? date.slice(0, 7) : date;
const billPaid = (b, key) => b.paidFor.includes(key);
/* Every due date of one bill in [from, to]. */
function billDates(b, from, to) {
  const f = billFreq(b), out = [], start = isDate(b.start) ? b.start : from;
  if (f === 'once') return start >= from && start <= to ? [start] : out;
  if (f === 'weekly' || f === 'biweekly') {
    const step = f === 'weekly' ? 7 : 14;
    let d = start < from ? addDays(start, Math.ceil(diffDays(start, from) / step) * step) : start;
    for (let g = 0; d <= to && g < 400; d = addDays(d, step), g++) out.push(d);
    return out;
  }
  const every = f === 'yearly' ? 12 : f === 'every-n' ? clamp(+b.every || 3, 2, 11) : 1;
  const days = f === 'twice-monthly' ? [b.dueDay, b.dueDay2 || 15] : [f === 'monthly' ? b.dueDay : +start.slice(8, 10)];
  for (let ym = from.slice(0, 7), g = 0; ym <= to.slice(0, 7) && g < 120; ym = addMonthsYM(ym, 1), g++) {
    if (every > 1) { const [y1, m1] = start.split('-').map(Number), [y2, m2] = ym.split('-').map(Number), n = (y2 - y1) * 12 + (m2 - m1); if (n < 0 || n % every) continue; }
    for (const day of days) { const d = `${ym}-${pad(Math.min(day, ymDays(ym)))}`; if (d >= from && d <= to) out.push(d); }
  }
  return out.sort();
}
function billStatus(b, key = curYM(), now = today()) {
  if (billPaid(b, key)) return 'paid';
  const due = billDueDate(b, key);
  if (due < now) return 'late';
  return diffDays(now, due) <= 3 ? 'soon' : 'upcoming';
}
/* Every occurrence with a due date in [from, to], paid or not. (`ym` is the occurrence key.) */
function billOccs(from, to) {
  const out = [];
  for (const b of S.bills) for (const date of billDates(b, from, to)) { const ym = billKey(b, date); out.push({ bill: b, ym, date, paid: billPaid(b, ym) }); }
  return out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
/* Unpaid bill occurrences with a due date in [from, to]. */
const billsBetween = (from, to) => billOccs(from, to).filter(x => !x.paid);
/* How many times a year a bill comes round (for "what does this cost me a year"). */
const BILL_PER_YEAR = { weekly: 52, biweekly: 26, 'twice-monthly': 24, monthly: 12, yearly: 1, once: 0 };
const billPerYear = b => b.amount * (billFreq(b) === 'every-n' ? 12 / clamp(+b.every || 3, 2, 11) : BILL_PER_YEAR[billFreq(b)]);
/* Home: unpaid bills due in the next `days` (7 — less overwhelm), plus any still unpaid from earlier this month. */
function upcomingBills(days = 7, now = today()) {
  const late = now.slice(8) === '01' ? [] : billsBetween(now.slice(0, 7) + '-01', addDays(now, -1)).map(x => ({ ...x, late: true }));
  return late.concat(billsBetween(now, addDays(now, days)));
}
/* Will the next paycheck cover the bills due before the one after it? */
function billsVsPaycheck(now = today()) {
  const p1 = nextPayday(now), p2 = nextPayday(p1);
  const before = billsBetween(now, addDays(p1, -1)), after = billsBetween(p1, addDays(p2, -1));
  const pay = expectedPaycheck(now), dueAfter = sum(after, x => x.bill.amount);
  return { now, p1, p2, before, after, pay, dueBefore: sum(before, x => x.bill.amount), dueAfter, left: pay - dueAfter, covers: pay >= dueAfter };
}

const lastMoneyDate = () => S.moneyDates.map(m => m.date).sort().pop() || '';
const moneyDateDue = () => { const l = lastMoneyDate(); return !l || diffDays(l, today()) >= 7; };

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const counts = [',', ';', '\t', '|'].map(d => [d, first.split(d).length]);
  const delim = counts.sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c !== ''));
}
const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
function parseDateStr(s, fmt) {

  let m;
  const mk = (y, mo, d) => { y = +y; if (y < 100) y += 2000; mo = +mo; d = +d; if (mo < 1 || mo > 12 || d < 1 || d > daysInMonth(y, mo)) return null; return `${y}-${pad(mo)}-${pad(d)}`; };
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) return mk(m[1], m[2], m[3]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/))) return fmt === 'dmy' ? mk(m[3], m[2], m[1]) : mk(m[3], m[1], m[2]);
  if ((m = s.match(/^(\d{1,2})[\s-]([a-z]{3,4})[a-z]*[\s-,]+(\d{2,4})$/i)) && MON[m[2].toLowerCase()]) return mk(m[3], MON[m[2].toLowerCase()], m[1]);
  if ((m = s.match(/^([a-z]{3,4})[a-z]*[\s-](\d{1,2}),?[\s-]+(\d{2,4})$/i)) && MON[m[1].toLowerCase()]) return mk(m[3], MON[m[1].toLowerCase()], m[2]);
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return mk(m[1], m[2], m[3]);
  return null;
}

  return 'mdy';
}

  openModal({
    title: isNew ? 'Add bill' : 'Edit bill',
    body: `<div class="form-grid">
      ${field('Bill name', `<input class="input" name="name" value="${esc(b.name)}" placeholder="e.g. Phone" autofocus maxlength="60">`, 'full')}
      ${field('Amount', moneyInput('amount', b.amount))}
      ${field('Repeats', selectHTML('freq', BILL_FREQ, billFreq(b)))}
      <div class="full form-grid" id="bill-when">${billWhenHTML(b)}</div>
      ${field('Envelope', selectHTML('category', envCats().map(c => [c.id, c.icon + ' ' + c.name]), b.category), 'full')}
      <div class="full">${toggleHTML('logExpense', b.logExpense !== false, 'When I mark it paid, also log it as spending')}</div>
    </div>`,
    footer: `${!isNew ? `<button type="button" class="btn ghost" data-act="delBill" data-id="${b.id}" data-close-modal style="margin-right:auto">Remove</button>` : ''}<button type="button" class="btn secondary" data-close-modal>Cancel</button><button type="submit" class="btn primary">${isNew ? 'Add bill' : 'Save'}</button>`,
    onOpen: m => m.el.addEventListener('change', e => { if (e.target.name === 'freq') $('#bill-when', m.el).innerHTML = billWhenHTML({ ...b, ...formVals(m.el) }); }),
    form: (m, v) => {
      const amount = toCents(v.amount);
      if (!v.name.trim()) return toast('Please give this bill a name');
      if (!(amount > 0)) return toast('Please enter the amount');
      if (v.start !== undefined && !isDate(v.start)) return toast('Please choose the due date');
      m.close();
      const rec = { name: v.name.trim(), amount, freq: v.freq, dueDay: clamp(+v.dueDay || +(v.start || '').slice(8, 10) || 1, 1, 31), category: v.category, logExpense: v.logExpense };
      if (v.dueDay2) rec.dueDay2 = clamp(+v.dueDay2, 1, 31);
      if (v.start) rec.start = v.start;
      if (v.every) rec.every = +v.every;
      if (isNew) commit('Bill added', () => S.bills.push({ id: uid(), ...rec, paidFor: [], paidTx: {} })); else commit('Bill updated', () => Object.assign(b, rec));
    }
  });
}
ACT.addBill = () => billModal(null);
ACT.editBill = el => billModal(S.bills.find(b => b.id === el.dataset.id));
ACT.delBill = el => { const b = S.bills.find(x => x.id === el.dataset.id); if (b) commit(`${b.name} removed — past spending stays in Activity`, () => { S.bills = S.bills.filter(x => x.id !== b.id); }); };

/* ---------- Calendar: one month of bills, spending and income ---------- */
let CAL_DAY = null;
function billCalendarHTML() {
  const ym = CAL_YM || (CAL_YM = curYM()), dim = ymDays(ym), first = ym + '-01', lead = (parseD(first).getDay() + 6) % 7;
  const occs = billOccs(first, `${ym}-${pad(dim)}`), day = {};
  const at = d => day[d] || (day[d] = { bills: [], out: 0, inc: 0 });
  occs.forEach(x => at(x.date).bills.push(x));
  txnsIn(ym).forEach(t => { if (t.type === 'income') at(t.date).inc += t.amount; else at(t.date).out += t.amount; });
  const names = Array.from({ length: 7 }, (_, i) => parseD(addDays(weekStart(today()), i)).toLocaleDateString(undefined, { weekday: 'short' }));
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span class="cal-pad"></span>';
  for (let n = 1; n <= dim; n++) {
    const d = `${ym}-${pad(n)}`, x = day[d] || { bills: [], out: 0, inc: 0 };
    const label = [fmtDay(d), x.bills.length ? plural(x.bills.length, 'bill') + ' due' : '', x.out ? money(x.out) + ' spent' : '', x.inc ? money(x.inc) + ' in' : ''].filter(Boolean).join(', ');
    cells += `<button type="button" class="cal-day ${d === today() ? 'today' : ''} ${d < today() ? 'past' : ''}" data-act="calDay" data-d="${d}" aria-label="${esc(label)}">
      <span class="cal-n">${n}</span>
      <span class="cal-dots">${x.bills.slice(0, 3).map(o => `<i class="${o.paid ? 'paid' : 'due'}"></i>`).join('')}${x.inc ? '<i class="inc"></i>' : ''}</span>
      <span class="cal-amt num">${x.out ? esc(x.out >= 100000 ? moneyC(x.out) : moneyR(Math.round(x.out / 100) * 100)) : ''}</span>
    </button>`;
  }
  const out = sum(Object.values(day), x => x.out), inc = sum(Object.values(day), x => x.inc);
  return `<section class="card cal-card">
    <div class="row between month-nav"><div class="row">${btn('‹', 'calMonth', 'secondary icon', 'data-d="-1" aria-label="Previous month"')}<h3 class="month-title">${monthName(ym)}</h3>${btn('›', 'calMonth', 'secondary icon', 'data-d="1" aria-label="Next month"')}${ym !== curYM() ? btn('This month', 'calMonth', 'ghost sm', 'data-d="0"') : ''}</div>
      <div class="legend"><span><i class="dot" style="background:var(--warn-bar)"></i>Bill due</span><span><i class="dot" style="background:var(--primary)"></i>Paid</span><span><i class="dot" style="background:var(--water)"></i>Money in</span></div></div>
    <div class="cal-grid cal-head" aria-hidden="true">${names.map(n => `<span>${esc(n)}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <p class="small muted" style="margin:14px 0 0">${esc(monthName(ym))}: <b class="num">${money(sum(occs, x => x.bill.amount))}</b> in bills · <b class="num">${money(out)}</b> spent · <b class="num">${money(inc)}</b> in. Tap a day to see it.</p>
  </section>`;
}
ACT.calMonth = el => { const d = +el.dataset.d; CAL_YM = d === 0 ? curYM() : addMonthsYM(CAL_YM || curYM(), d); render(); };
function calDayHTML(d) {
  const occs = billOccs(d, d), tx = S.transactions.filter(t => t.date === d).sort((a, b) => (a.loggedAt || '') < (b.loggedAt || '') ? 1 : -1);
  if (!occs.length && !tx.length) return `<div class="empty-mini"><span aria-hidden="true">🍃</span><div><b>A quiet day</b><div class="small muted">Nothing due and nothing logged.</div></div></div>`;
  return `<div class="stack">${occs.length ? `<div class="list">${occs.map(x => billRowHTML(x.bill, x.ym, true)).join('')}</div>` : ''}
    ${tx.length ? `<div class="list">${tx.map(txnRow).join('')}</div>` : ''}</div>`;
}
ACT.calDay = el => { CAL_DAY = el.dataset.d; openModal({ title: fmtDate(CAL_DAY, { weekday: 'long', month: 'long', day: 'numeric' }), sheet: true, body: calDayHTML(CAL_DAY), footer: '<button type="button" class="btn primary" data-close-modal>Done</button>', onClose: () => { CAL_DAY = null; } }); };

const debtStrategy = () => S.settings.debtStrategy === 'snowball' ? 'snowball' : 'avalanche';
VIEWS.debt = {

    return `
    <div class="grid g3 stats">

      <div class="card stat"><div class="label">Minimums each month</div><div class="value num">${money(sum(S.debts, d => d.minPayment))}</div></div>
      <div class="card stat"><div class="label">Debt-free around</div><div class="value" id="debt-free">${free ? esc(free) : 'Not moving yet'}</div><div class="delta muted">${free ? `${plural(sim.months, 'month')} with minimums` : 'see the note below'}</div></div>

      <ol class="order" id="debt-order">${sim.order.map((id, i) => { const d = byId(id), sd = sim.debts.find(x => x.id === id); return `<li><span class="rank">${i + 1}</span><span class="grow"><b>${esc(d.name)}</b><span class="small muted"> · ${(+d.apr).toFixed(1)}% APR</span></span><span class="small muted">${sd && sd.paidMonth ? 'paid off ~' + esc(monthLabelFromNow(sd.paidMonth)) : ''}</span></li>`; }).join('')}</ol>
      ${sim.done ? '' : `<div class="callout warn"><span>🌱 Right now the minimums don’t quite cover the interest, so the balance can’t shrink yet. Adding about <b class="num">${money(extraNeeded(S.debts))}</b> a month gets it moving.</span></div>`}

      <div class="card-h"><h3>What if you add a little?</h3></div>
      <label class="field"><span>Extra each month: <b class="num" id="debt-extra-v">${money(DEBT_EXTRA)}</b></span><input type="range" class="range" id="debt-extra" data-on="debtExtra" min="0" max="50000" step="500" value="${DEBT_EXTRA}" aria-label="Extra payment each month"></label>
      <div id="debt-plan">${debtPlanHTML()}</div>

    <div class="grid g2" style="margin-top:16px">${S.debts.map(d => `<section class="card debt-card">
      <div class="card-h"><h3 class="ellipsis">${esc(d.name)}</h3>${btn('✏️', 'editDebt', 'ghost icon', `data-id="${d.id}" aria-label="Edit ${esc(d.name)}"`)}</div>
      <div class="value num" style="font-size:24px;font-weight:700">${money(d.balance)}</div>
      <div class="row small muted" style="margin:6px 0 12px"><span class="badge">${(+d.apr).toFixed(2)}% APR</span><span class="badge">Min ${money(d.minPayment)}</span></div>
      ${btn('💵 Log a payment', 'payDebt', 'secondary sm', `data-id="${d.id}"`)}
    </section>`).join('')}</div>
    ${nudge ? `<div style="margin-top:16px">${nudge}</div>` : ''}`;
  }
};
/* The two payoff orders side by side at the chosen extra payment. */
function debtPlanHTML() {
  const base = simulateDebts(S.debts, 0, debtStrategy());
  const col = (name, key) => {
    const s = simulateDebts(S.debts, DEBT_EXTRA, key);
    return `<div class="plan-col ${key === debtStrategy() ? 'on' : ''}" data-strat="${key}"><span class="small muted">${name}</span><b>${s.done ? esc(monthLabelFromNow(s.months)) : 'Not moving yet'}</b><span class="small muted">${s.done ? `${plural(s.months, 'month')} · ${money(s.totalInterest)} interest` : 'needs a little more each month'}</span></div>`;
  };
  const now = simulateDebts(S.debts, DEBT_EXTRA, debtStrategy());
  const gain = DEBT_EXTRA && now.done ? (base.done ? `That’s ${plural(Math.max(0, base.months - now.months), 'month')} sooner and about ${money(Math.max(0, base.totalInterest - now.totalInterest))} less interest than minimums only.` : 'That’s enough to get the balance moving.') : 'Slide to see what a little extra each month would do.';
  return `<div class="plan-cols">${col('Highest interest first', 'avalanche')}${col('Smallest balance first', 'snowball')}</div><p class="small muted" id="debt-gain" style="margin:10px 0 0">${esc(gain)}</p>`;
}
ON.debtExtra = el => { DEBT_EXTRA = +el.value || 0; $('#debt-extra-v').textContent = money(DEBT_EXTRA); $('#debt-plan').innerHTML = debtPlanHTML(); };
ACT.debtStrat = el => commit(null, () => { S.settings.debtStrategy = el.dataset.t; }, { undo: false });
ACT.nudgeDismiss = () => commit(null, () => { S.settings.nudgeDismissed = true; }, { undo: false });
function debtModal(d) {
  const isNew = !d; d = d || { name: '', balance: null, apr: '', minPayment: null };
  openModal({
    title: isNew ? 'Add debt' : 'Edit debt',
    body: `<div class="form-grid">
      ${field('Name', `<input class="input" name="name" value="${esc(d.name)}" placeholder="e.g. Credit card" required autofocus maxlength="60">`, 'full')}
      ${field('Balance', moneyInput('balance', d.balance))}
      ${field('Interest rate (APR %)', `<input class="input" name="apr" inputmode="decimal" value="${esc(d.apr)}" placeholder="e.g. 22.9">`)}

ACT.addDebt = () => debtModal(null);
ACT.editDebt = el => debtModal(S.debts.find(d => d.id === el.dataset.id));
ACT.delDebt = el => { const d = S.debts.find(x => x.id === el.dataset.id); if (d) commit(`${d.name} removed`, () => { S.debts = S.debts.filter(x => x.id !== d.id); }); };
ACT.payDebt = el => {
  const d = S.debts.find(x => x.id === el.dataset.id); if (!d) return;
  openModal({
    title: 'Log a payment · ' + d.name, sheet: true,
    body: `<div class="stack">${field('Payment amount', moneyInput('amount', d.minPayment, 'autofocus'))}${toggleHTML('log', true, 'Also log it as spending (Debt payments)')}<p class="small muted">The balance goes down by the payment. Update the balance from your statement now and then so interest stays accurate.</p></div>`,

/* "Jordan": irregular gig income paid weekly, impulse-spend categories, two bills, one card, one goal.
   Deterministic, and always relative to today so the demo looks lived-in on any date. */
function demoState() {
  let seed = 20260930;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const between = (a, b) => Math.round(a + rnd() * (b - a));
  const st = blank({ currency: S.settings.currency || 'USD', theme: S.settings.theme || 'calm', userName: 'Jordan', paycheckFrequency: 'weekly', onboarded: true, tourDone: S.settings.tourDone, demo: true });
  const C = n => (st.categories.find(c => c.name === n) || st.categories[0]).id;
  const defaults = { 'Rent & home': 85000, Groceries: 33000, Takeout: 9000, 'Coffee & snacks': 6000, Transport: 11000, 'Bills & utilities': 7500, 'Phone & internet': 6500, 'Online shopping': 7000, 'Fun & hobbies': 3500, 'Games & apps': 2000, Health: 3000, 'Personal care': 2000, Subscriptions: 3000, 'Debt payments': 8500, Savings: 6000, Other: 2500 };
  const BILL_CATS = ['Rent & home', 'Phone & internet'];
  st.categories.forEach(c => { if (defaults[c.name]) c.budgetMonthly = defaults[c.name]; });
  const now = today(), cur = curYM(), start = addMonthsYM(cur, -2) + '-01';
  // Never later than this moment: an entry "logged" in the future would look like it came after a balance check
  // made now, and be taken off the checked balance a second time. Today's later entries move into the past hour or two.
  let early = 0;
  const at = (date, h) => { const d = parseD(date); d.setHours(h == null ? between(8, 21) : h, between(0, 59));
    if (d.getTime() > Date.now()) return new Date(Date.now() - (++early * 23 + between(5, 15)) * 60000).toISOString();
    return d.toISOString(); };
  const T = (date, type, amount, catName, note, extra = {}) => {
    if (date > now || date < start) return null;
    const t = { id: uid() + st.transactions.length, type, amount, category: extra.cat || C(catName), date, note, recurringId: extra.rid || null, loggedAt: extra.loggedAt || at(date) };
    if (extra.source) t.source = extra.source;
    st.transactions.push(t); return t;
  };
  // Income: weekly gig payouts every Monday (they vary), freelance invoices paid at the start of each month.
  for (let d = weekStart(start); d <= now; d = addDays(d, 7)) T(d, 'income', between(33000, 52000), 'Gig income', pick(['DoorDash weekly payout', 'Instacart payout', 'Uber Eats payout']), { loggedAt: at(d, 9) });
  for (let ym = start.slice(0, 7); ym <= cur; ym = addMonthsYM(ym, 1)) {
    T(`${ym}-01`, 'income', between(52000, 68000), 'Other income', 'Carried over from last month', { loggedAt: at(`${ym}-01`, 9) });
    T(`${ym}-02`, 'income', between(38000, 62000), 'Side hustle', pick(['Logo design invoice', 'Freelance illustration', 'Poster commission']));
  }
  // Everyday spending, day by day.
  for (let d = start; d <= now; d = addDays(d, 1)) {
    const dow = parseD(d).getDay();
    if (dow === 6) T(d, 'expense', between(4500, 9500), 'Groceries', pick(['Trader Joe’s', 'Aldi', 'Kroger']));
    if (rnd() < 0.3) T(d, 'expense', between(380, 890), 'Coffee & snacks', pick(['Corner café', 'Oat latte', 'Bakery', 'Snacks run']));
    if (rnd() < 0.12) T(d, 'expense', between(1200, 3400), 'Takeout', pick(['Thai takeout', 'Late-night pizza', 'Burrito bowl', 'Sushi delivery', 'Ramen']));
    if (rnd() < 0.06) T(d, 'expense', between(1500, 5200), 'Online shopping', pick(['Desk organizer', 'Headphones case', 'Plant shelf', 'Cozy hoodie']));
    if (rnd() < 0.05) T(d, 'expense', between(400, 1800), 'Games & apps', pick(['Game DLC', 'Puzzle app', 'Cozy farm game']));
    if (dow === 3 && rnd() < 0.7) T(d, 'expense', between(2800, 4400), 'Transport', pick(['Gas', 'Gas station']));
    if (rnd() < 0.03) T(d, 'expense', between(1500, 4500), 'Fun & hobbies', pick(['Art supplies', 'Climbing gym day pass', 'Movie night']));
  }
  for (let ym = start.slice(0, 7); ym <= cur; ym = addMonthsYM(ym, 1)) {
    T(`${ym}-11`, 'expense', between(5600, 8400), 'Bills & utilities', 'Electric bill');
    T(`${ym}-14`, 'expense', 1549, 'Subscriptions', 'Netflix');
    T(`${ym}-20`, 'expense', 8500, 'Debt payments', 'Credit card payment', { source: 'debt' });
    T(`${ym}-${pad(between(3, 26))}`, 'expense', between(1800, 3200), 'Health', 'Pharmacy');
  }
  // Spotify as a repeating item.
  const rid = 'r_spotify';
  for (let ym = start.slice(0, 7); ym <= cur; ym = addMonthsYM(ym, 1)) { const t = T(`${ym}-07`, 'expense', 1199, 'Subscriptions', 'Spotify', { rid }); if (t) t.id = 'rc_' + rid + '_' + t.date; }
  st.recurring.push({ id: rid, type: 'expense', amount: 1199, category: C('Subscriptions'), frequency: 'monthly', nextDate: `${cur}-07` > now ? `${cur}-07` : addMonthsD(`${cur}-07`, 1, 7), anchorDay: 7, note: 'Spotify' });
  // Bills (paid ones carry their linked expense).
  [['Rent', 85000, 5, 'Rent & home'], ['Phone & internet', 6500, 18, 'Phone & internet']].forEach(([name, amount, dueDay, cn], i) => {
    const b = { id: 'b_demo' + i, name, amount, dueDay, category: C(cn), logExpense: true, paidFor: [], paidTx: {} };
    for (let ym = start.slice(0, 7); ym <= cur; ym = addMonthsYM(ym, 1)) {
      const due = billDueDate(b, ym);
      if (due <= now) { const t = T(due, 'expense', amount, cn, name, { source: 'bill' }); t.id = 'tb' + i + ym; b.paidFor.push(ym); b.paidTx[ym] = t.id; }
    }
    st.bills.push(b);
  });
  st.debts.push({ id: 'd_demo1', name: 'Credit card', balance: 234000, apr: 23.9, minPayment: 8500 });
  st.goals.push({ id: 'g_demo1', name: 'Emergency fund', target: 200000, saved: 64000, targetDate: addMonthsD(now, 8, 1), color: '#5B8C5A' });
  [-40, -26, -12, -4].forEach(n => T(addDays(now, n), 'expense', pick([2500, 4000, 5000]), 'Savings', 'Moved to Emergency fund', { source: 'goal' }));
  // A few imported, not-yet-sorted things — waiting for a money date.
  [[-1, 1450, 'SQ *MARKET STALL 22'], [-2, 2399, 'PAYPAL *ONLINE ORDER'], [-4, 925, 'POS PURCHASE 4412']].forEach(([n, a, note]) => T(addDays(now, n), 'expense', a, null, note, { cat: UNCAT, source: 'csv', loggedAt: at(now, 8) }));
  // For the ADHD tax check to find: a fee and something charged twice.
  T(addDays(now, -12), 'expense', 3400, 'Other', 'Overdraft fee');
  [-3, -2].forEach(n => T(addDays(now, n), 'expense', 1299, 'Games & apps', 'Cozy farm game'));
  // Streak: logged by hand on each of the last 6 days (today included); the 7th day back came in by CSV import.
  const brk = addDays(now, -6);
  st.transactions.forEach(t => { if (t.date === brk && !t.source && !t.recurringId && t.type === 'expense') t.source = 'csv'; });
  for (let i = 0; i < 6; i++) { const d = addDays(now, -i); if (!st.transactions.some(t => t.date === d && t.type === 'expense' && !t.source && !t.recurringId)) T(d, 'expense', between(420, 780), 'Coffee & snacks', 'Oat latte'); }
  if (!st.transactions.some(t => t.date === now && t.category === C('Takeout'))) T(now, 'expense', 2240, 'Takeout', 'Thai takeout', { loggedAt: at(now, 13) });
  // This month: irregular income → envelopes share out what has actually come in (zero-based, the honest way).
  const incomeNow = st.transactions.filter(t => t.type === 'income' && t.date.slice(0, 7) === cur).reduce((a, t) => a + t.amount, 0);
  const plannedFull = Object.values(defaults).reduce((a, v) => a + v, 0);
  const bills = BILL_CATS.reduce((a, n) => a + defaults[n], 0), f = Math.max(0, Math.min(1, (incomeNow - bills) * 0.9 / (plannedFull - bills)));
  if (f < 1) { st.budgets[cur] = {}; st.categories.forEach(c => { if (defaults[c.name]) st.budgets[cur][c.id] = BILL_CATS.includes(c.name) ? defaults[c.name] : Math.round(defaults[c.name] * f / 500) * 500; }); }
  // Jordan has already nudged a few envelopes this month (that's what they're for) — all except Takeout.
  if (!st.budgets[cur]) { st.budgets[cur] = {}; st.categories.forEach(c => { if (defaults[c.name]) st.budgets[cur][c.id] = defaults[c.name]; }); }
  const spentCur = {}; st.transactions.forEach(t => { if (t.type === 'expense' && t.date.slice(0, 7) === cur) spentCur[t.category] = (spentCur[t.category] || 0) + t.amount; });
  st.categories.forEach(c => { const a = st.budgets[cur][c.id]; if (a != null && c.name !== 'Takeout' && c.id !== SAVINGS && (spentCur[c.id] || 0) > a) st.budgets[cur][c.id] = Math.ceil(((spentCur[c.id] || 0) + 1000) / 500) * 500; });
  // Takeout gently over this month, so the kind rebalance sheet has something to show.
  const tk = C('Takeout'), tkAssigned = st.budgets[cur][tk];
  const tkSpent = st.transactions.filter(t => t.category === tk && t.date.slice(0, 7) === cur).reduce((a, t) => a + t.amount, 0);
  if (tkSpent <= tkAssigned) T(addDays(now, -1) >= `${cur}-01` ? addDays(now, -1) : now, 'expense', tkAssigned - tkSpent + 1840, 'Takeout', 'Birthday dinner delivery');
  // Past money dates (weekly ritual), the latest 8 days ago → a new one is due.
  [[-8, 'Pause 24 hours before online buys'], [-15, 'Cook at home 3 times'], [-22, 'Log every coffee']].forEach(([n, note], i) => st.moneyDates.push({ id: 'md_demo' + i, date: addDays(now, n), note, sorted: [2, 3, 1][i] }));
  // One-tap buttons, a purchase on pause, a challenge under way, today's steps and a couple of parked thoughts.
  st.favs.push({ id: 'fv_demo1', amount: 550, category: C('Coffee & snacks'), note: 'Oat latte' }, { id: 'fv_demo2', amount: 275, category: C('Transport'), note: 'Bus fare' });
  st.wishes.push({ id: 'w_demo1', name: 'Noise-cancelling headphones', price: 17900, why: 'The open-plan office is loud', created: at(addDays(now, -1), 9), status: 'waiting' },
    { id: 'w_demo2', name: 'A third mechanical keyboard', price: 8900, why: '', created: at(addDays(now, -9), 20), status: 'released', decided: at(addDays(now, -6), 19) });
  st.challenges.push({ id: 'ch_demo1', type: 'w52', name: '52-week climb', start: addDays(now, -84), goalId: '', tiles: Array.from({ length: 52 }, (_, i) => ({ a: (i + 1) * 100, done: i < 9 || i === 11 ? addDays(now, -84 + i * 7) : '' })) });
  st.planDays.push({ id: now, energy: 'steady', note: '', ticks: {}, tasks: [{ id: 't_demo1', text: 'Mark the phone bill as paid', done: true }, { id: 't_demo2', text: 'Cancel the free trial before Friday', done: false }, { id: 't_demo3', text: 'Move $20 to the emergency fund', done: false }] });
  st.notes.push({ id: 'n_demo1', text: 'Is the yearly plan for the design app cheaper than paying monthly?', at: at(addDays(now, -2), 16) }, { id: 'n_demo2', text: 'Return the hoodie — the receipt is in my email', at: at(addDays(now, -1), 11) });
  st.expected.push({ id: 'ex_demo1', kind: 'pay', name: 'Poster commission, second half', amount: 18000, date: addDays(now, 4), category: C('Side hustle') }, { id: 'ex_demo2', kind: 'back', name: 'Hoodie return', amount: 4200, date: addDays(now, -1) });
  // A balance check from last night, so Safe to spend starts from a real number: bills before payday and a cushion held back, a sensible amount left.
  const mine = S; S = st;
  const ck = { id: 'ck_demo1', date: addDays(now, -1), at: at(addDays(now, -1), 22), amount: 0, expected: null, diff: 0 };
  st.settings.buffer = 4000; st.checks.push(ck);
  ck.amount = -safeFromBalance(ck, now).safe + diffDays(now, payPeriod(now).to) * 3400 + 4765;
  refreshStreaks(); earnStones(); // the stepping stones this history has already laid
  S = mine;
  stampAll(st); // sample data is "new" on this device
  return st;
}

/* =====================================================================

   No server, no account, no network. The user carries a code between devices.

/* Device identity: DEV (01-core.js) — stored next to the state under the one key, never inside a backup. */
const devShort = id => String(id || '').replace(/^d_/, '').slice(0, 6);

  bills: ['bill', 'bills'], recurring: ['repeating item', 'repeating items'], moneyDates: ['money date', 'money dates'], budget: ['envelope amount', 'envelope amounts'],
  checks: ['balance check', 'balance checks'], expected: ['expected payment', 'expected payments'], favs: ['one-tap button', 'one-tap buttons'], wishes: ['paused buy', 'paused buys'], challenges: ['challenge', 'challenges'],
  planDays: ['day plan', 'day plans'], notes: ['note', 'notes'], milestones: ['stepping stone', 'stepping stones']
};
/* Settings that change what the numbers mean. Linked devices keep these the same; look and feel stays per device. */
const PREF_KEYS = ['currency', 'paycheckFrequency', 'buffer', 'goalsInBalance', 'radarIgnore', 'debtStrategy', 'userName'];
const syncLabel = (k, n) => `${n} ${(SYNC_LABELS[k] || [k, k])[n === 1 ? 0 : 1]}`;

  if (s.lastSentAt === undefined) s.lastSentAt = null;   // last send — codes carry changes after this
  if (!Array.isArray(s.tombstones)) s.tombstones = [];
  if (!s.budgetCells || typeof s.budgetCells !== 'object' || Array.isArray(s.budgetCells)) s.budgetCells = {};

/* Called from migrate(): repair the sync block and backfill metadata on older data.

/* Stamp everything as written by this device now (used for demo data). */

/* ---------- Automatic change tracking — called by commit() ----------
   Diffs the state before and after a mutation: new/changed records get stamped,
   vanished records become tombstones, changed budget cells get cell timestamps.
   Undo restores the whole S (sync block included), so undone deletes leave no tombstone. */
function stampSyncChanges(beforeStr) {
  let before;
  try { before = JSON.parse(beforeStr); } catch (e) { return; }
  ensureSync(S);
  const now = stampNow();
  for (const coll of SYNC_COLLS) {
    const prev = new Map((before[coll] || []).map(r => [r.id, r]));
    const seen = new Set();
    for (const r of S[coll] || []) {
      if (!r || r.id == null) continue;
      seen.add(r.id);
      const p = prev.get(r.id);
      if (!p || (JSON.stringify(p) !== JSON.stringify(r) && !sameContent(p, r))) { r.updatedAt = now; r.deviceId = DEV; dropTomb(coll, r.id); }
    }
    for (const id of prev.keys()) if (!seen.has(id)) { dropTomb(coll, id); S.sync.tombstones.push({ collection: coll, id, deletedAt: now, deviceId: DEV }); }
  }
  const bb = before.budgets || {}, ab = S.budgets || {};
  for (const ym of new Set([...Object.keys(bb), ...Object.keys(ab)])) {
    const x = bb[ym] || {}, y = ab[ym] || {};
    for (const c of new Set([...Object.keys(x), ...Object.keys(y)])) if (x[c] !== y[c]) S.sync.budgetCells[cellKey(ym, c)] = now;
  }
  purgeOrphanCells(S);
  if (before.settings && PREF_KEYS.some(k => JSON.stringify(before.settings[k]) !== JSON.stringify(S.settings[k]))) S.settings.prefsAt = now;
}

/* ---------- Unicode-safe, chunked base64 ---------- */

const b64decode = b64 => new TextDecoder('utf-8', { fatal: true }).decode(b64ToBytes(b64));

/* ---------- Compression (browser built-in, offline) ----------
   Code formats:  v1 = base64(JSON)            — works everywhere

   Browsers without CompressionStream automatically fall back to v1, and can still read v1. */

async function gzipB64(str) {
  const stream = new Blob([new TextEncoder().encode(str)]).stream().pipeThrough(new CompressionStream('gzip'));
  return bytesToB64(new Uint8Array(await new Response(stream).arrayBuffer()));
